<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Petri — cellular life simulation</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2305070d'/%3E%3Ccircle cx='12' cy='13' r='6' fill='%233b82f6'/%3E%3Ccircle cx='20' cy='19' r='5' fill='%23ef4444'/%3E%3Ccircle cx='21' cy='10' r='3' fill='%23eab308'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title-block">
          <h1>Petri</h1>
          <span id="build-info" class="build-info"></span>
        </div>
        <div class="metrics">
          <div id="stats">Tick 0 · Population 0</div>
          <div id="perf" class="perf">0 FPS · 0 TPS</div>
        </div>
      </header>
      <main>
        <div id="canvas-wrap">
          <canvas id="grid-canvas"></canvas>
          <div id="inspector" class="inspector hidden" aria-live="polite">
            <button id="inspector-close" type="button" class="inspector-close" aria-label="Close inspector">&times;</button>
            <div id="inspector-content"></div>
          </div>
          <div id="stats-drawer" class="stats-drawer">
            <button id="stats-bar" type="button" class="stats-bar" aria-expanded="false" aria-controls="stats-drawer-body">
              <span class="stats-total">
                <span class="stats-label">Population</span>
                <span id="stats-total-value">0</span>
              </span>
              <span id="stats-chip-row" class="stats-chip-row"></span>
              <span id="stats-chevron" class="stats-chevron" aria-hidden="true"></span>
            </button>
            <div id="stats-drawer-body" class="stats-drawer-body hidden">
              <div class="stats-drawer-head">
                <div class="stats-pager">
                  <button id="stats-prev" type="button" class="stats-pager-btn" aria-label="Previous chart"></button>
                  <div class="stats-pager-mid">
                    <div id="stats-page-title" class="stats-page-title"></div>
                    <div id="stats-pager-dots" class="stats-pager-dots"></div>
                  </div>
                  <button id="stats-next" type="button" class="stats-pager-btn" aria-label="Next chart"></button>
                </div>
                <div id="stats-chips" class="stats-chips"></div>
              </div>
              <svg id="stats-chart" class="stats-chart"></svg>
              <div id="stats-legend" class="stats-legend"></div>
            </div>
          </div>
          <div id="icon-legend" class="icon-legend hidden">
            <div id="icon-legend-backdrop" class="icon-legend-backdrop"></div>
            <div class="icon-legend-panel" role="dialog" aria-modal="true" aria-label="Instruction icon legend">
              <button id="icon-legend-close" type="button" class="icon-legend-close" aria-label="Close legend">&times;</button>
              <h2 class="icon-legend-title">Instruction icons</h2>
              <div id="icon-legend-content"></div>
            </div>
          </div>
        </div>
      </main>
      <footer id="controls">
        <button id="pause-btn" type="button">Pause</button>
        <button id="tic-btn" type="button" class="hidden">Tic</button>
        <button id="add-btn" type="button">Add creature</button>
        <button id="inspect-btn" type="button" aria-pressed="false">Inspect</button>
        <label class="speed-control">
          Speed
          <input id="speed" type="range" min="0" max="11" step="1" value="6" />
          <span id="speed-value">60 ticks/s</span>
        </label>
        <span class="hint" id="hint">Tap the grid to add a creature</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
