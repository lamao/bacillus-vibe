<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Petri — cellular life simulation</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2305070d'/%3E%3Ccircle cx='12' cy='13' r='6' fill='%233b82f6'/%3E%3Ccircle cx='20' cy='19' r='5' fill='%23ef4444'/%3E%3Ccircle cx='21' cy='10' r='3' fill='%23eab308'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-BOLjr2h5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CZDlAuCt.css">
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title-block">
          <h1>Petri</h1>
          <span id="build-info" class="build-info"></span>
        </div>
        <div class="metrics">
          <div id="stats">Tick 0 · Population 0</div>
          <div id="perf" class="perf">0 FPS · 0 TPS</div>
        </div>
      </header>
      <main>
        <div id="canvas-wrap">
          <canvas id="grid-canvas"></canvas>
          <div id="inspector" class="inspector hidden" aria-live="polite">
            <button id="inspector-close" type="button" class="inspector-close" aria-label="Close inspector" title="Close inspector (Esc)">&times;</button>
            <div id="inspector-content"></div>
          </div>
          <div id="stats-drawer" class="stats-drawer">
            <button
              id="stats-bar"
              type="button"
              class="stats-bar"
              aria-expanded="false"
              aria-controls="stats-drawer-body"
              title="Toggle stats drawer (D)"
            >
              <span class="stats-total">
                <span class="stats-label">Population</span>
                <span id="stats-total-value">0</span>
              </span>
              <span id="stats-chip-row" class="stats-chip-row"></span>
              <span id="stats-chevron" class="stats-chevron" aria-hidden="true"></span>
            </button>
            <div id="stats-drawer-body" class="stats-drawer-body hidden">
              <div class="stats-drawer-head">
                <div class="stats-pager">
                  <button id="stats-prev" type="button" class="stats-pager-btn" aria-label="Previous chart" title="Previous chart ([)"></button>
                  <div class="stats-pager-mid">
                    <div id="stats-page-title" class="stats-page-title"></div>
                    <div id="stats-pager-dots" class="stats-pager-dots"></div>
                  </div>
                  <button id="stats-next" type="button" class="stats-pager-btn" aria-label="Next chart" title="Next chart (])"></button>
                </div>
                <div id="stats-chips" class="stats-chips"></div>
              </div>
              <svg id="stats-chart" class="stats-chart"></svg>
              <div id="stats-legend" class="stats-legend"></div>
            </div>
          </div>
          <div id="icon-legend" class="icon-legend hidden">
            <div id="icon-legend-backdrop" class="icon-legend-backdrop"></div>
            <div class="icon-legend-panel" role="dialog" aria-modal="true" aria-label="Instruction icon legend">
              <button id="icon-legend-close" type="button" class="icon-legend-close" aria-label="Close legend" title="Close legend (Esc)">&times;</button>
              <h2 class="icon-legend-title">Instruction icons</h2>
              <div id="icon-legend-content"></div>
            </div>
          </div>
        </div>
      </main>
      <footer id="controls">
        <button id="pause-btn" type="button" class="icon-btn" title="Pause the simulation (Space)">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use id="pause-icon-use" href="#ic-pause"></use></svg>
        </button>
        <button id="tic-btn" type="button" class="icon-btn hidden" title="Step one tick (S)">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-step"></use></svg>
        </button>
        <button id="add-btn" type="button" class="icon-btn" title="Add a random creature (A)">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-plus"></use></svg>
        </button>
        <button id="inspect-btn" type="button" class="icon-btn" aria-pressed="false" title="Inspect cells on the grid (I)">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-eye"></use></svg>
        </button>
        <label class="speed-control" title="Change simulation speed (- / =)">
          <svg class="btn-icon speed-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-speed"></use></svg>
          <input id="speed" type="range" min="0" max="11" step="1" value="6" aria-label="Simulation speed" />
          <span id="speed-value">60 ticks/s</span>
        </label>
        <span class="hint" id="hint">Tap the grid to add a creature</span>
        <button
          id="controls-menu-btn"
          type="button"
          class="icon-btn"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="controls-menu"
          title="More controls"
        >
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-menu"></use></svg>
        </button>
        <div id="controls-menu" class="controls-menu hidden" role="menu">
          <div class="controls-menu-group">
            <div class="controls-menu-group-title"><span class="dot" style="background: #22c55e"></span>View</div>
            <button type="button" class="controls-menu-row" id="menu-drawer-toggle" role="menuitemcheckbox" aria-checked="false">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-drawer"></use></svg>
              <span class="label">Stats drawer</span>
              <kbd>D</kbd>
              <span class="controls-menu-switch" aria-hidden="true"></span>
            </button>
            <button type="button" class="controls-menu-row" id="menu-legend-toggle" role="menuitemcheckbox" aria-checked="false">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-help"></use></svg>
              <span class="label">Icon legend</span>
              <kbd>H</kbd>
              <span class="controls-menu-switch" aria-hidden="true"></span>
            </button>
          </div>
          <hr class="controls-menu-divider" />
          <div class="controls-menu-group">
            <div class="controls-menu-group-title"><span class="dot" style="background: #4f8cff"></span>Save / Load</div>
            <button type="button" class="controls-menu-row" id="menu-save-btn" role="menuitem" title="Save to this browser">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-save"></use></svg>
              <span class="label">Save</span>
            </button>
            <button type="button" class="controls-menu-row" id="menu-load-btn" role="menuitem" title="Load from this browser">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-folder"></use></svg>
              <span class="label">Load</span>
            </button>
            <button type="button" class="controls-menu-row" id="menu-export-btn" role="menuitem" title="Download a save file to share">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-download"></use></svg>
              <span class="label">Export to file</span>
            </button>
            <button type="button" class="controls-menu-row" id="menu-import-btn" role="menuitem" title="Load a save file from disk">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-upload"></use></svg>
              <span class="label">Import from file</span>
            </button>
          </div>
          <hr class="controls-menu-divider" />
          <div class="controls-menu-group">
            <div class="controls-menu-group-title"><span class="dot" style="background: #a855f7"></span>Help</div>
            <div class="shortcut-table">
              <kbd>Space</kbd><span>Pause / resume</span>
              <kbd>S</kbd><span>Step one tick (while paused)</span>
              <kbd>A</kbd><span>Add creature</span>
              <kbd>I</kbd><span>Inspect mode</span>
              <kbd>&minus; / =</kbd><span>Simulation speed</span>
              <kbd>[&nbsp;&nbsp;]</kbd><span>Paginate stats pages</span>
              <kbd>Esc</kbd><span>Close topmost overlay</span>
            </div>
          </div>
        </div>
      </footer>
    </div>
    <input type="file" id="import-file-input" class="hidden" accept="application/json" aria-hidden="true" />
  </body>
</html>
