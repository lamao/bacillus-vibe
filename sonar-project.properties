# sonar.organization and sonar.projectKey are intentionally not set here.
# They're passed by .github/workflows/ci.yml from the repository's Actions
# variables (Settings -> Secrets and variables -> Actions -> Variables):
#   SONAR_ORGANIZATION, SONAR_PROJECT_KEY
# See README.md "CI / Sonar setup" for the one-time setup steps.

sonar.sources=src
sonar.tests=test
sonar.exclusions=dist/**,coverage/**,node_modules/**
sonar.test.inclusions=test/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# The 85% coverage gate (see vite.config.ts coverage.include) targets the
# engine only, by design (src/engine/**) - the UI is Canvas2D + DOM glue,
# verified by hand/browser rather than unit tests. Excluding it here keeps
# Sonar's own "coverage on new code" condition from flagging every UI change
# as a gate failure for lacking unit tests it was never meant to have.
# src/worker/** is the same kind of glue (message-passing between the main
# thread and the simulation worker) verified the same way, not with units.
sonar.coverage.exclusions=src/main.ts,src/ui/**,src/worker/**
