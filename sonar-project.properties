# sonar.organization and sonar.projectKey are intentionally not set here.
# They're passed by .github/workflows/ci.yml from the repository's Actions
# variables (Settings -> Secrets and variables -> Actions -> Variables):
#   SONAR_ORGANIZATION, SONAR_PROJECT_KEY
# See README.md "CI / Sonar setup" for the one-time setup steps.

sonar.sources=src
sonar.tests=test
sonar.exclusions=dist/**,coverage/**,node_modules/**
sonar.test.inclusions=test/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
